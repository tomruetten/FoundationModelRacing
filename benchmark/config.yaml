# One-shot benchmark config. Switch the model by changing `model:` (or pass --model on the CLI).
model: configs/models/alpamayo15.yaml       # alpamayo15 | alpamayo15_flashdrive | constant_velocity

data:
  recording: ../data     # trajectory.jsonl + frames/ (e.g. output dir of: run_racing.sh ... --save-frames)
  num_frames: 4          # frames per camera (10 Hz spacing), single front camera
  period_s: 0.1          # spacing between samples; 0.1 = same samples for all models (streaming models require it)
  max_samples: 150       # ~121 samples fit into the current 20 s recording
  min_speed: 0.0         # skip samples where the car is slower than this (m/s)

# Passed to the model as navigation text (<|route_start|>...). Set to null for no text at all (prompt ablation).
# Use run_tag to tell prompt variants apart in the results folder name.
run_tag: track_prompt
task_prompt: "Drive on the track between the cones on the left and right. Follow the yellow line markings on the ground that show the course of the track and stay between them. Complete one lap as fast as possible."
# earlier variant (run_tag: lap_prompt): "Complete one lap of the track as fast as possible."
num_samples: 6           # K trajectory samples per input -> ADE on sample 0, minADE over K
horizons_s: [2.0, 4.0, 5.0, 6.4]   # a horizon beyond the model's plan (Qwen-Drive: 5 s) is reported as NaN
warmup: 3                # first N predictions are timed but excluded from the statistics
seed: 42                 # randomness (reasoning tokens, diffusion noise) is seeded per sample from (seed, sample index)
# seeds: [1, 2, 3]       # or: python run_benchmark.py --seeds 1 2 3  -> one pass per seed + aggregate.md (mean/std over seeds)
output_dir: results
