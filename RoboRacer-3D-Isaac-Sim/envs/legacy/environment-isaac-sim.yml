# Isaac Sim environment
# Used by: simulation/isaac_sim/ (the Isaac Sim side of the dual-process IPC setup),
#          simulation/closed_loop/
#
# Isaac Sim itself (NVIDIA Omniverse app, version 6.0.1-rc.7) is not a
# pip/conda package — I install it separately via NVIDIA's own installer/
# launcher. This env only covers the Python side that talks to Isaac Sim
# over IPC (see simulation/isaac_sim/README.md for the dual-process architecture
# and why it's needed).
#
# Package list here is what simulation/isaac_sim/ and simulation/closed_loop/ actually
# import (numpy, pandas, matplotlib, scipy, torch — torch is for the
# GRU/dynamics-in-the-loop demo in simulation/closed_loop). If a script complains
# about a missing import, check simulation/isaac_sim/README.md or
# simulation/closed_loop/README.md and add it here.

name: env_isaac6
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - numpy
      - pandas
      - matplotlib
      - scipy
      - torch
